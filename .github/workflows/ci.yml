# The full check, on every push and pull request: types, lint, the test
# suite, a production build, the accessibility and layout audit of every
# screen, and the mock ERP's whole integration scenario over HTTP — both
# against the built app on a fresh local database. Any step failing fails
# the run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A throwaway SQLite file: CI never touches Turso.
      TURSO_DATABASE_URL: file:./ci.db
      TURSO_AUTH_TOKEN: ""
      AUTH_SECRET: ci-only-secret-used-nowhere-else
      # Seeds the sandbox API clients the mock ERP connects with.
      SANDBOX_CLIENT_SECRET: ci-only-sandbox-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Route types (RouteContext and friends) are generated by Next, not
      # committed; a clean checkout has none until they are generated.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrate and seed a local database
        run: npm run db:reset

      - name: Start the app
        run: |
          npm run start -- --port 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "The app did not start." && exit 1

      - name: Audit every screen
        run: npm run audit:ui

      # After the audit, which expects the seed as it was: the scenario hires
      # someone and books a journal.
      - name: Run the mock ERP against the app
        run: npm run sandbox

      - name: Server log
        if: failure()
        run: cat server.log || true
